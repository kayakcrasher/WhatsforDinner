<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FAF4F0">
<title>What's for Dinner?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF4F0; --surface:#FFF; --surface-alt:#F5EDE6;
    --primary:#E1A1A8; --primary-dark:#C7828C; --primary-light:#F2D1D4;
    --sage:#A3B59E; --sage-dark:#85997F;
    --text:#332929; --text-muted:#7A6B6B; --text-light:#AD9E9E;
    --terracotta:#CC7859; --gold:#D9AD5C;
    --shadow-sm:0 2px 8px rgba(51,41,41,.06);
    --shadow-md:0 4px 16px rgba(51,41,41,.08);
    --radius-md:20px; --radius-lg:28px; --radius-pill:100px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none}
  #app{height:100%;display:flex;flex-direction:column;padding:20px 18px 14px;max-width:480px;margin:0 auto;overflow-y:auto}

  header{text-align:center;margin-bottom:12px;position:relative;flex-shrink:0}
  header h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
  header p{font-size:13px;color:var(--text-muted);margin-top:2px;font-weight:500}
  .fav-count{position:absolute;top:0;right:0;background:var(--primary-light);color:var(--primary-dark);font-size:11px;font-weight:800;padding:4px 10px;border-radius:var(--radius-pill);cursor:pointer;border:none;font-family:inherit}

  .filter-block{margin-bottom:8px;flex-shrink:0}
  .filter-label{font-size:10px;font-weight:800;color:var(--text-light);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;padding-left:2px}
  .chip-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chip-row::-webkit-scrollbar{display:none}
  .chip{background:var(--surface);border:2px solid transparent;color:var(--text-muted);font-family:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:var(--radius-pill);cursor:pointer;box-shadow:var(--shadow-sm);transition:all .15s ease;flex-shrink:0;white-space:nowrap}
  .chip:active{transform:scale(.96)}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary-dark)}
  .chip.active.sage{background:var(--sage);border-color:var(--sage-dark)}
  .chip.active.terracotta{background:var(--terracotta);border-color:#a85c40}
  .chip.active.gold{background:var(--gold);border-color:#b8904a}

  .recipe-card{background:var(--surface);border-radius:var(--radius-lg);padding:24px 20px;box-shadow:var(--shadow-md);min-height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:transform .3s ease;margin:14px 0;flex-shrink:0;position:relative}
  .recipe-card.spinning{transform:scale(.98)}
  .recipe-empty{font-size:18px;font-weight:600;color:var(--text-light);line-height:1.4}
  .recipe-result{animation:pop .5s cubic-bezier(.34,1.56,.64,1);width:100%}
  .recipe-name{font-size:22px;font-weight:800;line-height:1.2;margin-bottom:8px;letter-spacing:-.5px}
  .recipe-meta{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
  .recipe-meta span{background:var(--surface-alt);color:var(--text-muted);font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--radius-pill)}
  .card-actions{display:flex;gap:6px;justify-content:center}
  .action-btn{background:var(--primary-light);color:var(--primary-dark);border:none;font-family:inherit;font-size:12px;font-weight:700;padding:7px 14px;border-radius:var(--radius-pill);cursor:pointer;display:flex;align-items:center;gap:4px}
  .action-btn.fav-active{background:var(--primary);color:#fff}
  .heart-btn{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;font-size:20px;line-height:1;padding:4px;opacity:.35;transition:opacity .15s,transform .15s}
  .heart-btn.active{opacity:1;transform:scale(1.15)}
  @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}

  .spinner-area{height:130px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
  .plate{width:110px;height:110px;border-radius:50%;background:#fff;box-shadow:var(--shadow-md);position:absolute;opacity:0;transition:opacity .3s ease}
  .plate.active{opacity:1;animation:spin 1s linear infinite}
  .plate::before{content:'';position:absolute;top:15%;left:15%;width:70%;height:70%;border-radius:50%;background:var(--primary)}
  .plate::after{content:'';position:absolute;top:40%;left:40%;width:20%;height:20%;border-radius:50%;background:var(--terracotta)}
  .plate .garnish{position:absolute;border-radius:50%}
  .plate .g1{width:14%;height:14%;background:var(--sage);top:55%;left:28%}
  .plate .g2{width:12%;height:12%;background:var(--gold);top:30%;left:60%}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  .btn-primary{background:var(--primary);color:#fff;border:none;font-family:inherit;font-size:18px;font-weight:800;padding:15px;border-radius:var(--radius-pill);cursor:pointer;box-shadow:var(--shadow-md);transition:all .15s ease;margin-bottom:10px;letter-spacing:-.3px;flex-shrink:0}
  .btn-primary:active:not(:disabled){background:var(--primary-dark);transform:scale(.98)}
  .btn-primary:disabled{opacity:.7;cursor:not-allowed}
  .nav-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0}
  .btn-secondary{background:var(--sage);color:#fff;border:none;font-family:inherit;font-size:13px;font-weight:700;padding:11px;border-radius:var(--radius-md);cursor:pointer;box-shadow:var(--shadow-sm);transition:all .15s ease}
  .btn-secondary.alt{background:var(--surface-alt);color:var(--text)}
  .btn-secondary:active{transform:scale(.98)}

  .footer-attr{text-align:center;font-size:10px;color:var(--text-light);margin-top:10px;line-height:1.4;flex-shrink:0}
  .footer-attr a{color:var(--text-muted);text-decoration:underline}

  .modal{display:none;position:fixed;inset:0;background:rgba(51,41,41,.5);z-index:100;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
  .modal.active{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal-content{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:24px 20px 32px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-content h2{font-size:20px;font-weight:800;margin-bottom:6px;letter-spacing:-.5px;padding-right:32px}
  .meta-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
  .meta-row span{background:var(--surface-alt);color:var(--text-muted);font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--radius-pill)}
  .modal-content h3{font-size:13px;font-weight:800;color:var(--primary-dark);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px}
  .modal-content ul,.modal-content ol{padding-left:20px;font-size:14px;line-height:1.7}
  .modal-content li{margin-bottom:5px}
  .modal-close{background:var(--surface-alt);color:var(--text);border:none;font-family:inherit;font-size:14px;font-weight:700;padding:12px;border-radius:var(--radius-md);cursor:pointer;width:100%;margin-top:20px}
  .premium-badge{display:inline-block;background:var(--gold);color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:var(--radius-pill);margin-left:6px;letter-spacing:.5px;vertical-align:middle}
  .recipe-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--surface-alt);cursor:pointer}
  .recipe-row:active{background:var(--surface-alt)}
  .recipe-row-heart{background:none;border:none;font-size:16px;cursor:pointer;padding:2px;flex-shrink:0;opacity:.35}
  .recipe-row-heart.active{opacity:1}
  .recipe-row-name{flex:1;font-weight:600;font-size:14px}
  .recipe-row-time{color:var(--text-light);font-size:12px;flex-shrink:0}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-light);font-size:14px;line-height:1.6}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>What's for Dinner?</h1>
    <p>Let us decide for you</p>
    <button class="fav-count" id="favBtn">♥ <span id="favCount">0</span></button>
  </header>

  <div class="filter-block">
    <div class="filter-label">Meal</div>
    <div class="chip-row" id="mealRow"></div>
  </div>

  <div class="filter-block">
    <div class="filter-label">Protein</div>
    <div class="chip-row" id="proteinRow"></div>
  </div>

  <div class="filter-block">
    <div class="filter-label">Cuisine</div>
    <div class="chip-row" id="cuisineRow"></div>
  </div>

  <div class="filter-block">
    <div class="filter-label">Filters</div>
    <div class="chip-row">
      <button class="chip terracotta" id="nutBtn">🚫 No Peanuts</button>
      <button class="chip gold" id="premBtn">👑 Premium (dev)</button>
    </div>
  </div>

  <div class="recipe-card" id="recipeCard">
    <button class="heart-btn" id="heartBtn" style="display:none">♥</button>
    <div class="recipe-empty" id="recipeEmpty">Tap below<br>and let us decide</div>
    <div class="recipe-result" id="recipeResult" style="display:none">
      <div class="recipe-name" id="recipeName"></div>
      <div class="recipe-meta" id="recipeMeta"></div>
      <div class="card-actions">
        <button class="action-btn" id="detailsBtn">See Recipe</button>
        <button class="action-btn" id="shareBtn">Share</button>
      </div>
    </div>
  </div>

  <div class="spinner-area">
    <div class="plate" id="plate">
      <div class="garnish g1"></div>
      <div class="garnish g2"></div>
    </div>
  </div>

  <button class="btn-primary" id="spinBtn">Surprise Me</button>

  <div class="nav-row">
    <button class="btn-secondary" id="recipesBtn">All Recipes</button>
    <button class="btn-secondary alt" id="settingsBtn">Settings</button>
  </div>

  <div class="footer-attr">
    Recipes curated locally and from <a href="https://www.themealdb.com">TheMealDB</a>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentRecipe = null;
let isSpinning = false;
let favorites = new Set(JSON.parse(localStorage.getItem("wfd_favs") || "[]"));
let cuisines = [];

const MEALS = [
  {key:"all",label:"All"},{key:"dinner",label:"Dinner"},{key:"dessert",label:"Dessert"},
  {key:"breakfast",label:"Breakfast"},{key:"soup",label:"Soup"},
  {key:"salad",label:"Salad"},{key:"appetizer",label:"Appetizer"},
];
const PROTEINS = [
  {key:"any",label:"Any"},{key:"chicken",label:"Chicken"},{key:"beef",label:"Beef"},
  {key:"pork",label:"Pork"},{key:"seafood",label:"Seafood"},
  {key:"lamb",label:"Lamb"},{key:"vegetarian",label:"Veggie"},
];
const state = {meal:"all",protein:"any",category:"all",no_peanuts:false,premium:false};

function saveFavs(){localStorage.setItem("wfd_favs",JSON.stringify([...favorites]));$("favCount").textContent=favorites.size;}
function isFav(id){return favorites.has(id);}
function toggleFav(id){
  if(favorites.has(id))favorites.delete(id);else favorites.add(id);
  saveFavs();
  if(currentRecipe && currentRecipe.id===id){
    $("heartBtn").classList.toggle("active",favorites.has(id));
  }
  document.querySelectorAll(`.recipe-row-heart[data-id="${id}"]`).forEach(b=>b.classList.toggle("active",favorites.has(id)));
}

async function loadCuisines(){
  const params = new URLSearchParams();
  params.set("tier", state.premium ? "paid" : "free");
  const res = await fetch("/api/categories?" + params.toString());
  cuisines = await res.json();
  buildChips();
}

function buildChips(){
  $("mealRow").innerHTML = MEALS.map(m =>
    `<button class="chip${m.key===state.meal?' active':''}" data-meal="${m.key}">${m.label}</button>`
  ).join("");
  $("proteinRow").innerHTML = PROTEINS.map(p =>
    `<button class="chip sage${p.key===state.protein?' active':''}" data-protein="${p.key}">${p.label}</button>`
  ).join("");

  const cuisineChips = [{name:"all",count:"All"}]
    .concat(cuisines.slice(0,12).map(c=>({name:c.name,count:c.count})));
  $("cuisineRow").innerHTML = cuisineChips.map(c =>
    `<button class="chip${c.name===state.category?' active':''}" data-cat="${c.name}">${c.name}</button>`
  ).join("");

  $("mealRow").querySelectorAll("[data-meal]").forEach(b=>b.addEventListener("click",()=>{state.meal=b.dataset.meal;buildChips();}));
  $("proteinRow").querySelectorAll("[data-protein]").forEach(b=>b.addEventListener("click",()=>{state.protein=b.dataset.protein;buildChips();}));
  $("cuisineRow").querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{state.category=b.dataset.cat;buildChips();}));
}

function filterQuery(){
  const p = new URLSearchParams();
  if(state.meal!=="all")p.set("meal_type",state.meal);
  if(state.protein!=="any")p.set("protein",state.protein);
  if(state.category!=="all")p.set("category",state.category);
  if(state.no_peanuts)p.set("no_peanuts","true");
  p.set("tier",state.premium?"paid":"free");
  return "?"+p.toString();
}

async function spin(){
  if(isSpinning)return;
  isSpinning=true;
  $("spinBtn").disabled=true;
  $("recipeResult").style.display="none";
  $("recipeEmpty").style.display="none";
  $("heartBtn").style.display="none";
  $("recipeCard").classList.add("spinning");
  $("plate").classList.add("active");

  try{
    const res = await fetch("/api/spin"+filterQuery());
    if(!res.ok){
      $("plate").classList.remove("active");
      $("recipeCard").classList.remove("spinning");
      $("recipeEmpty").innerHTML="No recipes match<br>those filters";
      $("recipeEmpty").style.display="block";
      isSpinning=false;$("spinBtn").disabled=false;
      return;
    }
    const recipe = await res.json();
    currentRecipe = recipe;
    setTimeout(()=>{
      $("plate").classList.remove("active");
      $("recipeCard").classList.remove("spinning");
      showRecipe(recipe);
      isSpinning=false;$("spinBtn").disabled=false;
    },1500);
  }catch(e){
    console.error(e);
    isSpinning=false;$("spinBtn").disabled=false;
    $("plate").classList.remove("active");
    $("recipeCard").classList.remove("spinning");
    $("recipeEmpty").style.display="block";
  }
}

function showRecipe(r){
  $("recipeName").textContent = r.name;
  const meta = [r.category, `${r.time} min`, `Serves ${r.servings}`];
  if(r.premium)meta.push("PRO");
  $("recipeMeta").innerHTML = meta.map(m=>`<span>${m}</span>`).join("");
  $("recipeEmpty").style.display="none";
  $("recipeResult").style.display="block";
  $("recipeResult").style.animation="none";
  void $("recipeResult").offsetWidth;
  $("recipeResult").style.animation="pop .5s cubic-bezier(.34,1.56,.64,1)";

  $("heartBtn").style.display="block";
  $("heartBtn").classList.toggle("active",isFav(r.id));
  $("heartBtn").textContent = isFav(r.id) ? "♥" : "♡";
  $("heartBtn").style.color = isFav(r.id) ? "var(--primary)" : "var(--text-light)";
}

function openModal(html){$("modalContent").innerHTML=html;$("modal").classList.add("active");}
function closeModal(){$("modal").classList.remove("active");}

function showDetails(r){
  openModal(`
    <h2>${r.name}${r.premium?'<span class="premium-badge">PRO</span>':''}</h2>
    <div class="meta-row">
      <span>${r.category||""}</span><span>${r.time} min</span><span>Serves ${r.servings}</span>
      ${r.protein?`<span>${r.protein}</span>`:""}
    </div>
    <h3>Ingredients</h3>
    <ul>${r.ingredients.map(i=>`<li>${i}</li>`).join("")}</ul>
    <h3>Steps</h3>
    <ol>${r.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
    <button class="modal-close" onclick="closeModal()">Close</button>
  `);
}

function recipeRowHTML(r){
  return `<div class="recipe-row" data-id="${r.id}">
    <button class="recipe-row-heart${isFav(r.id)?' active':''}" data-id="${r.id}">${isFav(r.id)?'♥':'♡'}</button>
    <span class="recipe-row-name">${r.name}${r.premium?'<span class="premium-badge">PRO</span>':''}</span>
    <span class="recipe-row-time">${r.time}m</span>
  </div>`;
}

async function showAllRecipes(){
  const res = await fetch("/api/recipes"+filterQuery());
  const data = await res.json();
  openModal(`
    <h2>All Recipes</h2>
    <p style="color:var(--text-muted);margin-bottom:14px;">${data.count} of ${data.total} recipes</p>
    ${data.recipes.length===0?'<div class="empty-state">No recipes match these filters</div>':
      data.recipes.map(recipeRowHTML).join("")}
    <button class="modal-close" onclick="closeModal()">Close</button>
  `);
  bindRecipeRows();
}

function showFavorites(){
  const all = [...favorites];
  openModal(`
    <h2>Favorites</h2>
    <p style="color:var(--text-muted);margin-bottom:14px;">${all.length} saved</p>
    <div id="favList"><div class="empty-state">Loading...</div></div>
    <button class="modal-close" onclick="closeModal()">Close</button>
  `);
  loadFavoriteRows(all);
}

async function loadFavoriteRows(ids){
  const list = $("favList");
  if(!ids.length){list.innerHTML='<div class="empty-state">No favorites yet.<br>Tap the ♡ on any recipe to save it.</div>';return;}
  const results = await Promise.all(
    ids.map(id=>fetch("/api/recipe/"+id).then(r=>r.ok?r.json():null))
  );
  const valid = results.filter(Boolean);
  list.innerHTML = valid.map(recipeRowHTML).join("");
  bindRecipeRows();
}

function bindRecipeRows(){
  $("modalContent").querySelectorAll(".recipe-row").forEach(row=>{
    row.addEventListener("click",async e=>{
      if(e.target.classList.contains("recipe-row-heart"))return;
      const id = parseInt(row.dataset.id);
      const r = await fetch("/api/recipe/"+id).then(x=>x.json());
      showDetails(r);
    });
  });
  $("modalContent").querySelectorAll(".recipe-row-heart").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      toggleFav(id);
      btn.classList.toggle("active",isFav(id));
      btn.textContent = isFav(id) ? "♥" : "♡";
    });
  });
}

async function shareRecipe(r){
  const text = `${r.name} — ${r.time} min, serves ${r.servings}\n\nIngredients:\n${r.ingredients.map(i=>"• "+i).join("\n")}\n\nSteps:\n${r.steps.map((s,i)=>`${i+1}. ${s}`).join("\n")}\n\nvia What's for Dinner?`;
  if(navigator.share){
    try{await navigator.share({title:r.name,text});}catch(e){}
  }else{
    await navigator.clipboard.writeText(text);
    alert("Recipe copied to clipboard");
  }
}

// -- Event wiring --
$("nutBtn").addEventListener("click",()=>{state.no_peanuts=!state.no_peanuts;$("nutBtn").classList.toggle("active",state.no_peanuts);});
$("premBtn").addEventListener("click",async()=>{
  state.premium=!state.premium;
  $("premBtn").classList.toggle("active",state.premium);
  await loadCuisines();
});
$("spinBtn").addEventListener("click",spin);
$("detailsBtn").addEventListener("click",()=>currentRecipe&&showDetails(currentRecipe));
$("shareBtn").addEventListener("click",()=>currentRecipe&&shareRecipe(currentRecipe));
$("heartBtn").addEventListener("click",()=>{
  if(!currentRecipe)return;
  toggleFav(currentRecipe.id);
  $("heartBtn").classList.toggle("active",isFav(currentRecipe.id));
  $("heartBtn").textContent = isFav(currentRecipe.id) ? "♥" : "♡";
  $("heartBtn").style.color = isFav(currentRecipe.id) ? "var(--primary)" : "var(--text-light)";
});
$("recipesBtn").addEventListener("click",showAllRecipes);
$("favBtn").addEventListener("click",showFavorites);
$("settingsBtn").addEventListener("click",()=>{
  openModal(`
    <h2>Settings</h2>
    <p style="color:var(--text-muted);margin-bottom:20px;">Coming soon</p>
    <button class="modal-close" onclick="closeModal()">Close</button>
  `);
});
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal();});

// -- Boot --
saveFavs();
buildChips();
loadCuisines();
</script>
</body>
</html>
